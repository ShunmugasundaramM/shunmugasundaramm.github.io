a{min-height:48px;display:inline-flex;align-items:center;gap:8px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--line);color:var(--ink)}
a.primary{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
