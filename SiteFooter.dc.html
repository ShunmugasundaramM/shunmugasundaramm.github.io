<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="pf-data.js"></script>
</helmet>
<footer style="border-top:1px solid var(--pf-line);background:var(--pf-bg);color:var(--pf-ink);font-family:'Inter Tight',system-ui,sans-serif">
<div style="max-width:1280px;margin:0 auto;padding:clamp(48px,6vw,80px) clamp(20px,4vw,40px) 32px;display:flex;flex-direction:column;gap:48px">
<sc-if value="{{ hasNext }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:20px">
<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
<span style="font-size:14px;font-weight:600;color:var(--pf-mute)">Next project</span>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<a href="{{ prev.href }}" style="min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--pf-line);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--pf-ink);transition:border-color .2s" style-hover="border-color:var(--pf-acc);color:var(--pf-ink)"><i class="ph ph-arrow-left"></i>{{ prev.title }}</a>
<a href="/projects/" style="min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--pf-line);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--pf-ink);transition:border-color .2s" style-hover="border-color:var(--pf-acc);color:var(--pf-ink)"><i class="ph ph-squares-four"></i>All projects</a>
</div>
</div>
<a data-reveal href="{{ next.href }}" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));border:1px solid var(--pf-line);border-radius:16px;overflow:hidden;background:var(--pf-card);color:var(--pf-ink);transition:border-color .3s,box-shadow .35s,transform .35s cubic-bezier(.16,1,.3,1)" style-hover="border-color:var(--pf-acc);box-shadow:0 24px 60px -20px var(--pf-glow);transform:translateY(-3px);color:var(--pf-ink)">
<div style="aspect-ratio:16/10;background:radial-gradient(120% 90% at 80% 0%,var(--pf-glow),transparent 60%),var(--pf-bg2);overflow:hidden;display:grid;place-items:center"><sc-if value="{{ next.img }}" hint-placeholder-val="{{ false }}"><img src="{{ next.img }}" alt="{{ next.title }} cover" loading="lazy" style="width:100%;height:100%;object-fit:cover;object-position:{{ next.pos }};display:block"></sc-if><sc-if value="{{ nextNoImg }}" hint-placeholder-val="{{ false }}"><span style="font-family:Michroma,sans-serif;font-size:56px;color:transparent;-webkit-text-stroke:1px var(--pf-mute)">{{ next.mono }}</span></sc-if></div>
<div style="padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;justify-content:center;gap:14px">
<span style="font-size:13px;font-weight:600;color:var(--pf-acc)">{{ next.sub }}</span>
<span style="font-family:Michroma,sans-serif;font-size:clamp(20px,2.4vw,30px);line-height:1.25;text-wrap:balance">{{ next.title }}</span>
<span style="font-size:16px;line-height:1.6;color:var(--pf-mute);max-width:44ch">{{ next.desc }}</span>
<span style="display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin-top:8px">View case study<i class="ph ph-arrow-right" style="color:var(--pf-acc)"></i></span>
</div>
</a>
</div>
</sc-if>
<sc-if value="{{ showCta }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px">
<h2 style="margin:0;max-width:18ch;font-family:Michroma,sans-serif;font-weight:400;font-size:clamp(24px,3vw,38px);line-height:1.2;letter-spacing:-.01em;text-wrap:balance">Have a product that needs clarity?</h2>
<a href="./#contact" style="height:52px;padding:0 26px;border-radius:999px;background:var(--pf-acc);color:var(--pf-accInk);font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px;white-space:nowrap;transition:transform .2s cubic-bezier(.16,1,.3,1)" style-hover="transform:translateY(-2px);color:var(--pf-accInk)">Get in touch<i class="ph ph-arrow-right"></i></a>
</div>
</sc-if>
<nav aria-label="All projects" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:32px">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:12px">
<span style="font-size:13px;font-weight:600;color:var(--pf-mute)">{{ g.label }}</span>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 24px">
<sc-for list="{{ g.items }}" as="p" hint-placeholder-count="4">
<a href="{{ p.href }}" aria-current="{{ p.current }}" style="min-height:44px;display:flex;align-items:center;gap:8px;font-size:15px;color:{{ p.color }};transition:color .2s" style-hover="color:var(--pf-acc)">{{ p.title }}</a>
</sc-for>
</div>
</div>
</sc-for>
</nav>
<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding-top:24px;border-top:1px solid var(--pf-line);font-size:14px;color:var(--pf-mute)">
<span>© {{ year }} Shunmugasundaram M</span>
<a href="mailto:sundaram6252@gmail.com" style="min-height:44px;display:flex;align-items:center;color:var(--pf-ink);font-weight:600" style-hover="color:var(--pf-acc)">sundaram6252@gmail.com</a>
<div style="display:flex;gap:8px">
<sc-for list="{{ socials }}" as="s" hint-placeholder-count="3">
<a href="{{ s.href }}" target="_blank" rel="noopener" aria-label="{{ s.label }}" style="width:44px;height:44px;border-radius:999px;border:1px solid var(--pf-line);display:grid;place-items:center;color:var(--pf-ink);font-size:18px;transition:border-color .2s,color .2s" style-hover="border-color:var(--pf-acc);color:var(--pf-acc)"><i class="{{ s.icon }}"></i></a>
</sc-for>
</div>
</div>
</div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;520px&quot;},&quot;home&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;youtube&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    const tick = () => { if (window.PF_DATA && window.PF_DATA.projects) { clearInterval(this.poll); this.forceUpdate(); return true; } return false; };
    if (!tick()) this.poll = setInterval(tick, 50);
  }
  componentWillUnmount() { clearInterval(this.poll); }
  renderVals() {
    const P = (window.PF_DATA && window.PF_DATA.projects) || [];
    const here = location.pathname.replace(/index\.html$/, '').replace(/([^/])$/, '$1/');
    const mk = p => ({ title: p.title, href: p.href, current: p.href === here ? 'page' : undefined, color: p.href === here ? 'var(--pf-acc)' : 'var(--pf-ink)' });
    const idx = P.findIndex(p => p.href === here);
    const pick = p => p ? { ...p, pos: p.pos || 'top', img: p.img || '' } : {};
    const next = idx >= 0 ? pick(P[(idx + 1) % P.length]) : {};
    const prev = idx >= 0 ? pick(P[(idx - 1 + P.length) % P.length]) : {};
    return {
      hasNext: !this.props.home && idx >= 0, next, prev, nextNoImg: !next.img,
      showCta: !this.props.home,
      groups: [
        { label: 'UI/UX & product', span: 'span 2', items: P.filter(p => p.cat === 'UI/UX').map(mk) },
        { label: 'Branding & marketing', span: 'auto', items: P.filter(p => p.cat !== 'UI/UX').map(mk) }
      ],
      socials: [
        { label: 'LinkedIn', href: 'https://www.linkedin.com/in/shunmugasundaramm/', icon: 'ph ph-linkedin-logo' },
        { label: 'Behance', href: 'https://www.behance.net/shunmugsundara1', icon: 'ph ph-behance-logo' },
        { label: 'YouTube', href: this.props.youtube || 'https://www.youtube.com/@joshuasundar', icon: 'ph ph-youtube-logo' }
      ],
      year: new Date().getFullYear()
    };
  }
}
</script>
</body>
</html>
